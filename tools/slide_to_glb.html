<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>UE Slide FBX -&gt; GLB converter</title>
    <!--
      Build-time converter (NOT part of the game). Mirrors roll_to_glb.html but bakes the
      forward SLIDE: loads the UE Mannequin mesh + A_Rifle_Slide.fbx with a MODERN three.js
      FBXLoader (r160, which parses these UE 2020 anim exports that the runtime's r127 cannot)
      and exports a small binary GLB carrying the bone hierarchy + ONE clip named 'slide':
        assets/characters/ue/Slide.glb
      The game loads it with its own (r127) GLTFLoader and pulls animations[0], so the existing
      SK_Mannequin.glb (and all its clips) is left untouched — zero regression risk. Kept in
      native UE space (Z-up, cm); adaptClipToPreOriented does the Y-up/metre fix at runtime.

      IN-PLACE: unlike the roll (which shipped a pre-made RollForward_InPlace.FBX), A_Rifle_Slide
      keeps its forward travel in the PELVIS track, so we neutralize the pelvis HORIZONTAL drift
      here (hold native x + native y to frame 0) while KEEPING native z (= world UP after the
      runtime rotX(-90) fix — the authored body-drop of the slide). PlayerControls then owns the
      travel exactly like the roll. Run via tools/run_slide_bake.mjs (headless Chrome for Testing),
      or the pure-Node twin d:/tmp/jogcheck/bake_slide.mjs.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
      import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

      const status = { steps: [] };
      const log = (m) => { status.steps.push(m); document.title = m; };

      try {
        const loader = new FBXLoader();
        const base = '../assets/characters/ue/';

        log('loading mesh');
        const mesh = await loader.loadAsync(base + 'SK_Mannequin.FBX');
        mesh.name = 'SK_Mannequin';

        log('loading anim slide');
        const fbx = await loader.loadAsync(base + 'A_Rifle_Slide.fbx');
        const clip = fbx.animations[0];
        clip.name = 'slide';

        // IN-PLACE: hold the pelvis HORIZONTAL translation (native x, native y) to frame 0; keep the
        // vertical (native z, the body-drop). adaptClipToPreOriented maps native (x,y,z) -> world
        // (x, z, -y), so native x = world lateral and native y = world forward (both horizontal),
        // native z = world up. Removing in-plane root motion here makes PlayerControls own the travel.
        const pelvisPos = clip.tracks.find((t) => t.name === 'pelvis.position');
        if (pelvisPos) {
          const v = pelvisPos.values, x0 = v[0], y0 = v[1];
          for (let i = 0; i < v.length; i += 3) { v[i] = x0; v[i + 1] = y0; /* v[i+2] (up) kept */ }
        }
        // Drop any stray root.* tracks (defensive; adapt drops them at runtime anyway).
        clip.tracks = clip.tracks.filter((t) => !t.name.startsWith('root.'));

        // We only need the CLIP (it drives the game's own rig by bone name). Export just the bone
        // hierarchy — NOT the skinned-mesh geometry — so the GLB stays tiny (~tens of KB). Find the
        // topmost bone (its parent is not a bone) and export that subtree; the slide's tracks all
        // target bones in it, so the animation exports intact.
        let topBone = null;
        mesh.traverse((o) => { if (o.isBone && !topBone && !(o.parent && o.parent.isBone)) topBone = o; });
        const exportRoot = topBone || mesh;
        exportRoot.animations = [clip];

        log('exporting glb');
        const exporter = new GLTFExporter();
        const glb = await new Promise((resolve, reject) => {
          exporter.parse(exportRoot, resolve, reject, { binary: true, animations: [clip], includeCustomExtensions: true });
        });

        const bytes = new Uint8Array(glb);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        window.__GLB_B64 = btoa(bin);
        status.bytes = bytes.length;
        status.clips = [{ name: clip.name, dur: +clip.duration.toFixed(3), tracks: clip.tracks.length }];
        status.ok = true;
        log('done');
      } catch (e) {
        status.ok = false;
        status.error = (e.message || String(e)) + '\n' + (e.stack || '');
        log('error');
      }
      window.__STATUS = status;
    </script>
  </body>
</html>
